<!DOCTYPE html>
<html>

<head>
    <title>Simulador</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">

</head>

<body id="popupBody">
    <h3>Simulador de Actividad</h3>
    <button id="toggleBtn">Activar</button>

    <label for="intervalSelect">Intervalo:</label>
    <select id="intervalSelect" class="margenes-select">
        <option value="10000">10 milisegundos</option>
        <option value="60000">1 minuto</option>
        <option value="180000">3 minutos</option>
        <option value="300000">5 minutos</option>
    </select>

    <label for="actividadSelect">Simulación:</label>
    <select id="actividadSelect" class="margenes-select">
        <option value="mouse">Mouse</option>
        <option value="click">Clicks</option>
        <option value="scroll">Scroll</option>
        <option value="tecla">Teclas</option>
        <option value="todas">Todas</option>
    </select>


    <p id="status" class="estado-inactivo">Estado: Desactivado</p>

    <div id="toast" class="toast">Mensaje</div>

    <script src="popup.js"></script>
</body>

</html>
