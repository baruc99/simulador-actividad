<!DOCTYPE html>
<html>

<head>
    <title>Simulador</title>
    <!-- Estilos personalizados -->
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 16px;
            background-color: white;
            width: 240px;
        }

        h3 {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 16px;
        }

        button {
            background-color: #4CAF50;
            /* Color verde */
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            margin-bottom: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        p {
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* Estilos para el estado */
        .estado-activo {
            color: green;
        }

        .estado-inactivo {
            color: red;
        }
    </style>
</head>

<body>
    <h3>Simulador de Actividad</h3>

    <button id="toggleBtn">Activar</button>

    <p id="status" class="estado-inactivo">Estado: Desactivado</p>

    <script src="popup.js"></script>
</body>

</html>
