<!DOCTYPE html>
<html>

<head>
    <title>Simulador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 16px;
            width: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
        }

        h3 {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 16px;
        }

        button {
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            margin-bottom: 16px;
            color: white;
            background-color: #4CAF50;
        }

        button:hover {
            background-color: #45a049;
        }

        p {
            font-size: 0.875rem;
            font-weight: 500;
        }

        .estado-activo {
            color: green;
        }

        .estado-inactivo {
            color: red;
        }
    </style>
</head>

<body id="popupBody">
    <h3>Simulador de Actividad</h3>
    <button id="toggleBtn">Activar</button>
    <p id="status" class="estado-inactivo">Estado: Desactivado</p>
    <script src="popup.js"></script>
</body>

</html>
